plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // Gson есть в самом Minecraft, версия совпадает с игровой.
    compileOnly 'com.google.code.gson:gson:2.10.1'
    // Cloth Config API одинаковое для Fabric и NeoForge: общий экран настроек
    // компилируется здесь, а нужная реализация подтягивается в лоадер-модулях.
    compileOnly "maven.modrinth:cloth-config:${cloth_version}+neoforge"
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
