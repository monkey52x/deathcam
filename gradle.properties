# Важно: все поля ниже также добавлены в expandProps в buildSrc (multiloader-common.gradle).
# Имена/описания только ASCII — кириллица для отображаемого названия прописана
# напрямую в fabric.mod.json и neoforge.mods.toml.

# Project
version=1.0.0
group=com.vlogf.deathcamera
java_version=21

# Common
minecraft_version=1.21.1
minecraft_version_range=[1.21.1, 1.22)
mod_name=Death Camera
mod_author=VLOGF
mod_id=deathcamera
license=MIT
credits=
description=Death camera: third-person view, orbit around the corpse and a living world after death.
## Версия NeoForm для common-проекта: https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
## Parchment: https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Библиотеки для экрана настроек (Modrinth Maven)
# Cloth Config: файл config/deathcamera.json правится и без него, экран в игре требует установленный Cloth Config.
cloth_version=15.0.140
# ModMenu (только Fabric, только для кнопки настроек): https://modrinth.com/mod/modmenu
modmenu_version=11.0.5

# Fabric
fabric_version=0.102.0+1.21.1
fabric_loader_version=0.16.14

# NeoForge
neoforge_version=21.1.248
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
